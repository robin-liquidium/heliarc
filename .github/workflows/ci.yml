name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: python3 -m unittest discover -s script/tests -p 'test_*.py'
      - run: python3 script/prepare_release.py && git diff --exit-code
      - run: python3 -m py_compile script/*.py
      - run: python3 script/package_app.py
